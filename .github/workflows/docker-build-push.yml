name: Build and Push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Login to DockerHub
      run: docker login -u="${{ secrets.DOCKERHUB_USERNAME }}" -p="${{ secrets.DOCKERHUB_PASSWORD }}"
      
    - name: Build Service Docker image
      run: docker build --file "${{ github.workspace }}/Service/Dockerfile" --tag digiwells/osdcdrillingclusterservice:stable --tag digiwells/osdcdrillingclusterservice:sha-${{ github.sha }} .

    - name: Push Docker image for Service to DockerHub
      run: |
        docker push digiwells/osdcdrillingclusterservice:stable
        docker push digiwells/osdcdrillingclusterservice:sha-${{ github.sha }}

    - name: Build WebApp Docker image
      run: docker build --file "${{ github.workspace }}/WebApp/Dockerfile" --tag digiwells/osdcdrillingclusterwebappclient:stable --tag digiwells/osdcdrillingclusterwebappclient:sha-${{ github.sha }} .

    - name: Push Docker image for WebApp to DockerHub
      run: |
        docker push digiwells/osdcdrillingclusterwebappclient:stable
        docker push digiwells/osdcdrillingclusterwebappclient:sha-${{ github.sha }}
